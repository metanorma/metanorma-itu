name: lock-refresh
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: bundle lock --add-platform ruby aarch64-darwin arm64-darwin x86_64-darwin aarch64-linux x86_64-linux x64-mingw-ucrt x64-mingw32
      - name: Commit refreshed lock
        run: |
          git config user.name "lockbot"
          git config user.email "lockbot@users.noreply.github.com"
          git add Gemfile.lock
          git diff --cached --quiet || (git commit -m "Lock refresh (GHA runner)" && git push)
